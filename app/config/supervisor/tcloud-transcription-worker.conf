; transcriptor-pg-native-queue: unit supervisord del worker PG.
;
; Reemplaza a tcloud-transcription-batch-* (las cuales ejecutaban
; queue:work sobre la cola Redis 'transcription' con jobs de la clase de job
; del transcriptor eliminada por este change).
;
; Cada unit corre su propia instancia de `transcription:worker --storage=ALL`,
; poleando la tabla `transcriptions` con FOR UPDATE SKIP LOCKED. numprocs=3
; permite paralelismo; stopwaitsecs=3600 deja tiempo para terminar el job
; en curso (un ffmpeg puede tardar varios minutos) antes de SIGKILL.

[program:tcloud-transcription-worker]
command=php /www/wwwroot/cloud.mediaserver.com.co/Tcloud_v2/app/artisan transcription:worker --storage=ALL
directory=/www/wwwroot/cloud.mediaserver.com.co/Tcloud_v2/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=3
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/var/log/tcloud/transcription-worker.log
stderr_logfile=/var/log/tcloud/transcription-worker.err
stopwaitsecs=3600
user=www-data
priority=10